name: Offline checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884
        with:
          version: "0.12.1"
      - run: uv sync --locked --extra dev --python 3.13
      - run: uv run --locked ruff check src tests
      - run: uv run --locked pytest -q
      - run: uv run --locked prompt-or-tune demo
      - run: uv run --locked prompt-or-tune verify
      - run: uv build
