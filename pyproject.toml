[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "prompt-or-tune"
version = "0.1.0"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "LICENSES/*"]
description = "A recorded comparison of prompt engineering and LoRA for structured classification"
requires-python = ">=3.11"
dependencies = [
  "openai>=1.68.0",
  "pydantic>=2.10.0",
  "python-dotenv>=1.0.1",
]

[project.scripts]
prompt-or-tune = "fireworks_lab.portfolio:main"

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fireworks_lab"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
